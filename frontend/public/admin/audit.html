<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Audit Log — Daspe Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/css/main.css"/>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>Daspe Admin</div>
  <nav class="sidebar-nav">
    <div class="nav-section">Admin</div>
    <a href="/admin/" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Overview</a>
    <a href="/admin/users.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Users<span class="nav-badge" id="pendingBadge" style="display:none">0</span></a>
    <a href="/admin/deployments.html" class="nav-item"><svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/></svg>Deployments</a>
    <a href="/admin/broadcast.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2"/></svg>Broadcast</a>
    <a href="/admin/audit.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Audit Log</a>
    <hr style="margin:8px;border-color:var(--border)"/>
    <a href="/dashboard/" class="nav-item"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>User View</a>
    <button class="nav-item" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
  </nav>
  <div class="sidebar-footer"><div class="user-chip"><img class="avatar" id="sidebarAvatar" src="" alt=""/><div class="user-chip-info"><div class="user-chip-name" id="sidebarName">Admin</div><div class="user-chip-sub">Administrator</div></div></div></div>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="main">
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="topbar-title">Audit Log</span>
    <div class="topbar-actions"><button class="btn btn-ghost btn-sm" onclick="load()">Refresh</button></div>
  </div>
  <div class="content">
    <div class="page-header"><h1 class="page-title">Audit Log</h1><p class="page-sub">Every action on the platform logged with user, IP, and timestamp</p></div>
    <div class="tbl-wrap">
      <table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Resource</th><th>IP Address</th></tr></thead>
      <tbody id="auditTbody"><tr><td colspan="5"><div class="loading"><div class="spin"></div>Loading</div></td></tr></tbody>
      </table>
    </div>
    <div style="margin-top:14px;text-align:center"><button class="btn btn-ghost btn-sm" id="loadMoreBtn" onclick="loadMore()">Load More</button></div>
  </div>
</div>
</div>
<script src="/assets/js/app.js"></script>
<script>
let page = 1;
async function init() {
  const user = await checkAuth('/');
  if (!user || user.role !== 'admin') return window.location.href = '/dashboard/';
  document.getElementById('sidebarAvatar').src = user.avatar || '';
  document.getElementById('sidebarName').textContent = user.username;
  initSidebar();
  load();
  loadPending();
}
async function loadPending() {
  try { const d = await api.get('/api/admin/pending-count'); const pb = document.getElementById('pendingBadge'); if(pb){pb.textContent=d.count;pb.style.display=d.count>0?'block':'none';} } catch{}
}
async function load() {
  page = 1;
  try {
    const logs = await api.get(`/api/admin/audit?page=1&limit=50`);
    document.getElementById('auditTbody').innerHTML = rows(logs);
  } catch(e) { toast.error(e.message); }
}
async function loadMore() {
  page++;
  try {
    const logs = await api.get(`/api/admin/audit?page=${page}&limit=50`);
    document.getElementById('auditTbody').innerHTML += rows(logs);
    if (logs.length < 50) document.getElementById('loadMoreBtn').style.display = 'none';
  } catch(e) { toast.error(e.message); }
}
function rows(logs) {
  if (!logs.length) return '<tr><td colspan="5" style="text-align:center;color:var(--white-4);padding:20px">No logs</td></tr>';
  return logs.map(l => `<tr>
    <td class="mono text-xs" style="color:var(--white-4)">${new Date(l.created_at).toLocaleString()}</td>
    <td class="text-sm">${l.github_username || 'System'}</td>
    <td><span class="tag">${l.action}</span></td>
    <td class="text-xs text-muted">${l.resource_type ? l.resource_type + (l.resource_id ? ' ' + l.resource_id.slice(0,8) : '') : 'N/A'}</td>
    <td class="mono text-xs" style="color:var(--white-4)">${l.ip_address || 'N/A'}</td>
  </tr>`).join('');
}
init();
</script>
</body>
</html>
