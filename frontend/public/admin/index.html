<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin — Daspe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/css/main.css"/>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>Daspe Admin</div>
  <nav class="sidebar-nav">
    <div class="nav-section">Admin</div>
    <a href="/admin/" class="nav-item active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Overview</a>
    <a href="/admin/users.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>Users<span class="nav-badge" id="pendingBadge" style="display:none">0</span></a>
    <a href="/admin/deployments.html" class="nav-item"><svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/></svg>Deployments</a>
    <a href="/admin/broadcast.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.57 3.4 2 2 0 0 1 3.54 1h3a2 2 0 0 1 2 1.72"/></svg>Broadcast</a>
    <a href="/admin/audit.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Audit Log</a>
    <hr style="margin:8px;border-color:var(--border)"/>
    <a href="/dashboard/" class="nav-item"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>User View</a>
    <button class="nav-item" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
  </nav>
  <div class="sidebar-footer"><div class="user-chip"><img class="avatar" id="sidebarAvatar" src="" alt=""/><div class="user-chip-info"><div class="user-chip-name" id="sidebarName">Admin</div><div class="user-chip-sub">Administrator</div></div></div></div>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="main">
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="topbar-title">Platform Overview</span>
    <div class="topbar-actions"><button class="btn btn-ghost btn-sm" onclick="load()">Refresh</button></div>
  </div>
  <div class="content">
    <div class="page-header"><h1 class="page-title">Admin Overview</h1><p class="page-sub">Platform health, users, and live resource usage</p></div>
    <div class="stats-row" id="adminStats"><div class="loading"><div class="spin"></div>Loading</div></div>
    <div class="grid-2" style="margin-bottom:20px">
      <div class="card"><div class="section-hd"><h3>Server Resources</h3></div><div id="serverRes"><div class="loading"><div class="spin"></div></div></div></div>
      <div class="card"><div class="section-hd"><h3>Docker</h3></div><div id="dockerStats"><div class="loading"><div class="spin"></div></div></div></div>
    </div>
    <div class="section-hd"><h3>Pending Approvals</h3><a href="/admin/users.html?status=pending" class="btn btn-ghost btn-sm">View all</a></div>
    <div id="pendingList"><div class="loading"><div class="spin"></div>Loading</div></div>
  </div>
</div>
</div>
<script src="/assets/js/app.js"></script>
<script>
async function init() {
  const user = await checkAuth('/');
  if (!user || user.role !== 'admin') return window.location.href = '/dashboard/';
  document.getElementById('sidebarAvatar').src = user.avatar || '';
  document.getElementById('sidebarName').textContent = user.username;
  initSidebar();
  load();
  setInterval(load, 30000);
}
async function load() {
  try {
    const [stats, pending] = await Promise.all([api.get('/api/admin/stats'), api.get('/api/admin/users?status=pending&limit=6')]);
    const u = stats.users, d = stats.deployments, s = stats.system;
    document.getElementById('adminStats').innerHTML = `
      <div class="stat-box"><div class="stat-box-label">Total Users</div><div class="stat-box-value">${u.total}</div><div class="stat-box-sub">${u.pending} pending approval</div></div>
      <div class="stat-box"><div class="stat-box-label">Active</div><div class="stat-box-value" style="color:var(--success)">${u.active}</div><div class="stat-box-sub">${u.suspended} suspended</div></div>
      <div class="stat-box"><div class="stat-box-label">Deployments</div><div class="stat-box-value">${d.total}</div><div class="stat-box-sub">${d.failed} failed</div></div>
      <div class="stat-box"><div class="stat-box-label">Running</div><div class="stat-box-value" style="color:var(--success)">${d.running}</div><div class="stat-box-sub">${d.building} building</div></div>
      <div class="stat-box"><div class="stat-box-label">RAM Used</div><div class="stat-box-value">${s.memory.used_mb} MB</div><div class="stat-box-sub">of ${s.memory.total_mb} MB total</div></div>
      <div class="stat-box"><div class="stat-box-label">CPU Load</div><div class="stat-box-value">${s.cpu_load['1m'].toFixed(2)}</div><div class="stat-box-sub">Uptime ${s.uptime_hours}h</div></div>`;
    document.getElementById('serverRes').innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${resBar(s.memory.used_mb, s.memory.total_mb, 'System RAM')}<div class="res-bar-wrap"><div class="res-bar-label"><span>Load Average</span><span>${s.cpu_load['1m'].toFixed(2)} / ${s.cpu_load['5m'].toFixed(2)} / ${s.cpu_load['15m'].toFixed(2)}</span></div></div></div>`;
    document.getElementById('dockerStats').innerHTML = `<div class="grid-2"><div class="stat-box card-sm"><div class="stat-box-label">Running</div><div class="stat-box-value" style="color:var(--success)">${stats.docker.running_containers||0}</div></div><div class="stat-box card-sm"><div class="stat-box-label">Total</div><div class="stat-box-value">${stats.docker.total_containers||0}</div></div></div>`;
    const pb = document.getElementById('pendingBadge');
    if (pb) { pb.textContent = u.pending; pb.style.display = u.pending > 0 ? 'block' : 'none'; }
    if (!pending.users.length) { document.getElementById('pendingList').innerHTML = '<div class="empty"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><h3>No pending approvals</h3><p>All user accounts are reviewed</p></div>'; return; }
    document.getElementById('pendingList').innerHTML = `<div class="user-grid">${pending.users.map(u => card(u)).join('')}</div>`;
  } catch(e) { toast.error(e.message); }
}
function card(u) {
  return `<div class="user-card">
    <div class="user-card-top"><img class="avatar" src="${u.github_avatar||''}" alt="" style="width:44px;height:44px;border-radius:50%"/><div class="user-card-info"><div class="user-card-name">${u.github_name||u.github_username}</div><div class="user-card-handle">@${u.github_username}</div></div>${fmt.badge(u.status)}</div>
    <div class="text-xs text-muted" style="margin-bottom:10px">${u.github_email||'No email'} &middot; ${u.github_followers} followers &middot; ${u.github_public_repos} repos</div>
    ${u.github_bio?`<div class="text-xs" style="color:var(--white-3);margin-bottom:10px">"${u.github_bio.slice(0,70)}"</div>`:''}
    <div style="display:flex;gap:6px">
      <button class="btn btn-success btn-sm" style="flex:1" onclick="approve('${u.id}')">Approve</button>
      <button class="btn btn-danger btn-sm" onclick="reject('${u.id}')">Reject</button>
      <a href="/admin/user.html?id=${u.id}" class="btn btn-ghost btn-sm">View</a>
    </div>
  </div>`;
}
async function approve(id) { try { await api.post(`/api/admin/users/${id}/approve`); toast.success('User approved'); load(); } catch(e) { toast.error(e.message); } }
async function reject(id) {
  if (!await confirm('Reject Account','Reject this user application?','Reject')) return;
  try { await api.post(`/api/admin/users/${id}/reject`,{reason:'Application not approved.'}); toast.info('User rejected'); load(); } catch(e) { toast.error(e.message); }
}
init();
</script>
</body>
</html>
