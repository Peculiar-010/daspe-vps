<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Deployments — Daspe Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/css/main.css"/>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>Daspe Admin</div>
  <nav class="sidebar-nav">
    <div class="nav-section">Admin</div>
    <a href="/admin/" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Overview</a>
    <a href="/admin/users.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Users<span class="nav-badge" id="pendingBadge" style="display:none">0</span></a>
    <a href="/admin/deployments.html" class="nav-item active"><svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/></svg>Deployments</a>
    <a href="/admin/broadcast.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2"/></svg>Broadcast</a>
    <a href="/admin/audit.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Audit Log</a>
    <hr style="margin:8px;border-color:var(--border)"/>
    <a href="/dashboard/" class="nav-item"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>User View</a>
    <button class="nav-item" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
  </nav>
  <div class="sidebar-footer"><div class="user-chip"><img class="avatar" id="sidebarAvatar" src="" alt=""/><div class="user-chip-info"><div class="user-chip-name" id="sidebarName">Admin</div><div class="user-chip-sub">Administrator</div></div></div></div>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="main">
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="topbar-title">All Deployments</span>
    <div class="topbar-actions">
      <select id="statusFilter" style="width:auto" onchange="load()"><option value="">All Status</option><option value="running">Running</option><option value="stopped">Stopped</option><option value="failed">Failed</option><option value="building">Building</option></select>
      <button class="btn btn-ghost btn-sm" onclick="load()">Refresh</button>
    </div>
  </div>
  <div class="content">
    <div class="page-header"><h1 class="page-title">Deployments</h1><p class="page-sub" id="depCount">Loading</p></div>
    <div class="tbl-wrap">
      <table><thead><tr><th>Name</th><th>User</th><th>Status</th><th>Runtime</th><th>RAM</th><th>Domain</th><th>Deployed</th><th>Actions</th></tr></thead>
      <tbody id="depsTbody"><tr><td colspan="8"><div class="loading"><div class="spin"></div>Loading</div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>
</div>
<div class="overlay" id="logModal"><div class="modal" style="max-width:700px"><div class="modal-hd"><span class="modal-title">Container Logs</span><button class="modal-close" onclick="modal.close('logModal')">&#x2715;</button></div><div class="log-viewer" id="logContent" style="max-height:55vh">Loading...</div></div></div>
<script src="/assets/js/app.js"></script>
<script>
let allDeps = [];
async function init() {
  const user = await checkAuth('/');
  if (!user || user.role !== 'admin') return window.location.href = '/dashboard/';
  document.getElementById('sidebarAvatar').src = user.avatar || '';
  document.getElementById('sidebarName').textContent = user.username;
  initSidebar();
  load();
  loadPending();
}
async function loadPending() {
  try { const d = await api.get('/api/admin/pending-count'); const pb = document.getElementById('pendingBadge'); if(pb){pb.textContent=d.count;pb.style.display=d.count>0?'block':'none';} } catch{}
}
async function load() {
  const st = document.getElementById('statusFilter').value;
  try {
    allDeps = await api.get('/api/admin/deployments');
    const deps = st ? allDeps.filter(d => d.status === st) : allDeps;
    document.getElementById('depCount').textContent = `${deps.length} deployment${deps.length !== 1 ? 's' : ''}`;
    const BASE = location.hostname.replace(/^[^.]+\./,'');
    document.getElementById('depsTbody').innerHTML = deps.map(d => `<tr>
      <td><div class="user-row-info"><div class="user-row-name">${d.name}</div><div class="user-row-sub">${fmt.runtime(d.runtime)} &middot; ${d.type}</div></div></td>
      <td><div class="user-row"><img class="avatar" src="${d.github_avatar||''}" alt=""/><span>${d.github_username}</span></div></td>
      <td>${fmt.badge(d.status)}</td>
      <td class="mono text-xs">${d.runtime}</td>
      <td class="mono text-xs">${d.ram_limit_mb} MB</td>
      <td class="text-xs" style="color:var(--white-4)">${d.subdomain ? d.subdomain+'.'+BASE : 'None'}</td>
      <td class="text-xs text-muted">${d.deployed_at ? fmt.ago(d.deployed_at) : 'Never'}</td>
      <td><div style="display:flex;gap:4px">
        ${d.status==='running'?`<button class="btn btn-danger btn-sm" onclick="stop('${d.id}')">Stop</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="viewLog('${d.id}')">Logs</button>
      </div></td>
    </tr>`).join('');
  } catch(e) { toast.error(e.message); }
}
async function stop(id) {
  if (!await confirm('Force Stop','Stop this deployment immediately?','Stop')) return;
  try { await api.post(`/api/admin/deployments/${id}/stop`); toast.warning('Stopped'); load(); } catch(e) { toast.error(e.message); }
}
async function viewLog(id) {
  modal.open('logModal');
  document.getElementById('logContent').textContent = 'Loading...';
  try { const d = await api.get(`/api/admin/deployments/${id}/logs`); document.getElementById('logContent').textContent = d.logs || 'No logs'; } catch(e) { document.getElementById('logContent').textContent = e.message; }
}
init();
</script>
</body>
</html>
